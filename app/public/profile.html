<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACS Gas Station — Profile</title><link rel="stylesheet" href="/css/style.css"></head><body>
<nav></nav>
<div class="page">
  <div class="page-header"><h1>👤 My <span>Profile</span></h1><p>Your ACS Gas Station loyalty account</p></div>
  <div class="card" style="max-width:600px">
    <div id="profileInfo"><div style="color:var(--grey)">Loading...</div></div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
if(!requireLogin()){}
renderNav();
async function init(){
  const user=await loadUser();if(!user)return;
  $('profileInfo').innerHTML=`
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border2)">
      <div style="width:60px;height:60px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;color:#fff">${user.name.charAt(0)}</div>
      <div><div style="font-size:1.1rem;font-weight:700">${user.name}</div><div style="color:var(--grey);font-size:.82rem">${user.email}</div></div>
    </div>
    <table><tbody>
      <tr><td style="color:var(--grey);width:150px;padding:8px 0">Customer ID</td><td style="font-family:monospace;color:var(--green)">${user.customer_id}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Role</td><td><span class="badge badge-green">${user.role}</span></td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Loyalty Points</td><td style="font-weight:700;color:var(--green)">${user.loyalty_points?.toLocaleString()}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Loyalty Card</td><td style="font-family:monospace;color:var(--red)">${user.card_number}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Vehicle Plate</td><td style="font-family:monospace">${user.vehicle_plate||'—'}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Phone</td><td>${user.phone||'—'}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Station</td><td>${user.station_id||'HVF-GH-001'}</td></tr>
      <tr><td style="color:var(--grey);padding:8px 0">Member Since</td><td>${fmtDate(user.created_at)}</td></tr>
    </tbody></table>`;
}
init();
</script></body></html>
